<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>memoryGame</title>
    </head>
        <script>
        function user(){
            document.getElementById('user').innerHTML = "五年"+localStorage.getItem('class') + "班 "+localStorage.getItem('number') + "號 " + localStorage.getItem('name');
        }
        var cards = ['../cards/Halloween/cardWitchA.png',
                    '../cards/Halloween/cardWitchB.png',
                    '../cards/Halloween/cardPumpkinA.png',
                    '../cards/Halloween/cardPumpkinB.png',
                    '../cards/Halloween/cardVampireA.png',
                    '../cards/Halloween/cardVampireB.png',
                    '../cards/Halloween/cardGhostA.png',
                    '../cards/Halloween/cardGhostB.png'];
        var flipCard = [];
        var score = 0;
        var time = 0;
var sec=0, clear=0, sec2=0, timerid;
    function start(){
        if (clear==0){
            sec2=0;
            var ref=document.getElementById('cnt3');
            window.setInterval(( () =>{sec2++;ref.innerHTML=sec2;} ), 1000);
            sec=0;
            //timerid=window.setInterval(changestyle, 1000);
            timerid=window.setInterval(show, 1000);
            window.setInterval(changestyle, 1000); 
            localStorage.setItem('timeMemoryGame', sec2);
        }
    }

    function clearauto(){
        clear=1;
        clearInterval(timerid);
    }
        
        function show(i){
            var card = document.getElementsByTagName('img');
            if(i < card.length){
                card[i].src = cards[i];
                flipCard.push(i);

                if(flipCard.length == 2){
                    if(cards[flipCard[0]] == cards[flipCard[1]]){
                        // 配對成功，增加分數
                        score += 10;
                        // 顯示提示訊息
                        document.getElementById('message').innerHTML="配對成功！";
                        // 卡片保持翻開狀態，所以不需要翻回去
                        card[flipCard[0]].src = "../cards/Halloween/cardBack.png";
                        card[flipCard[1]].src = "../cards/Halloween/cardBack.png";
                    }
                    else{
                        // 配對失敗，減少分數
                        score -= 5;
                        document.getElementById('message').innerHTML="配對失敗！";
                        setTimeout(function(){
                        // 翻回卡片
                        card[flipCard[0]].src = "../cards/Halloween/cardBack.png";
                        card[flipCard[1]].src = "../cards/Halloween/cardBack.png";
                        }, 1000);
                    }
                    document.getElementById('score').innerHTML = "分數：" + score;
                    flipCard = [];
                }
            }
            localStorage.setItem('scoreMemoryGame', score);
        }
</script>
        
<body onload="user();start();">
        <span id="time"></span>
        <table aria-label="Memory Game" align="middle">
            <h2>記憶遊戲</h2>時間：<span id='cnt3'></span>秒
            <tr>
                <td><button onclick="show(0);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td>
                <td><button onclick="show(1);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
                <td><button onclick="show(2);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
                <td><button onclick="show(3);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td>       
            </tr>
            <tr>
                <td><button onclick="show(4);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
                <td><button onclick="show(5);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
                <td><button onclick="show(6);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
                <td><button onclick="show(7);"><img src="../cards/Halloween/cardBack.png" alt="Card Back" width="200" height="300"></button></td> 
            </tr>
        </table>
        <span id="message" style="font-weight:bold;font-size:'10'; font-family:Arial, Helvetica, sans-serif"><b></b></span><br>
        <span id="score" style="font-weight:bold; color:blue;font-size:'10'; font-family:Arial, Helvetica, sans-serif"><b>分數：</b></span><br>
        <br>
        <button onclick="window.location='random_quiz.html';">下一頁 Next</button>
    </body>
    </html>
