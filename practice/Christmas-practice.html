<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Practice</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.0/css/bootstrap.min.css">
<style>
  .hidden { display: none; }
</style>
<head>
    <meta charset="utf-8">
    <title>Story about Christmas 關於聖誕節的故事</title>
    <!--Bootstrap 核心CSS檔案-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <!-- jQuery -->
    <link rel="stylesheet" href="../assets/form.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!--Bootstrap 核心JavaScript檔案-->
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Andika|Noto+Sans+TC">
<style>
  body {
    font-family: 'Andika',serif;
  }
</style>
<script>
var time = 0;
    var sec=0, clear=0, sec2=0, timerid;
    var sec2 = 0;
    var timerid;

    function start(){
        if (!timerid){ // 檢查計時器是否已經啟動
            sec2 = 0;
            var ref = document.getElementById('time_ChristmasPractice');
            timerid = window.setInterval(() => {
                sec2++;
                ref.innerHTML = sec2;
                localStorage.setItem('time_ChristmasPractice', sec2);
            }, 1000);
        }
    }

    function clearauto(){
        clear=1;
        clearInterval(timerid);
    }
</script>
</head>
<body onload="start();">

<div class="container mt-5">
  <h2 class="mb-4">Christmas Practice</h2>
  <span id="time_ChristmasPractice"></span>秒
  <form id="quizForm">
    <!-- Multiple Choice Questions -->
    <div class="form-group">
      <p>1. Who send gifts to kids?</p>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="question1" id="q1a" value="1">
        <label class="form-check-label" for="q1a">Santa Claus</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="question1" id="q1b" value="0">
        <label class="form-check-label" for="q1b">A vampire </label>
      </div>
    </div>

    <!-- Short Answer Question -->

    <!-- Fill in the Blanks -->
    <div class="form-group">
        2. <img src="../cards/Christmas/giftB.png" width="150" height="180"> 寫英文
      <input type="text" class="form-control" id="question5">
    </div>

    <!-- Vocabulary Question -->
    <div class="form-group">
      3. <img src="../cards/Christmas/reindeerB.png" width="150" height="180"> 寫英文
      <input type="text" class="form-control" id="question7">
    </div>

    <div class="form-group">
        4. <img src="../cards/Christmas/christmasTreeB.png" width="150" height="180"> 寫英文
        <input type="text" class="form-control" id="question3">
      </div>

    <button type="button" class="btn btn-primary" onclick="calculateScore()">Submit</button>
  </form>

  <div class="mt-4 hidden" id="result">
    <h3>Your Score: <span id="score">0</span>/4</h3>
  </div>
</div>

<!-- Bootstrap and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function calculateScore() {
  var score = 0;
  // Multiple Choice
  var q1Answer = $('input[name="question1"]:checked').val();
  score += parseInt(q1Answer, 10);

  // Fill in the Blanks
  var answers5 = $('#question5').val().toLowerCase();
  if(answers5=== 'gift') score++;

  // Vocabulary Question
  var q7Answer = $('#question7').val().toLowerCase();
  if(q7Answer === 'reindeer') score++;

  var q3Answer = $('#question3').val().toLowerCase();
  if(q3Answer === 'Christmas tree') score++;
  // Display score
  $('#score').text(score);
  $('#result').removeClass('hidden');
    localStorage.setItem('score_ChristmasPractice', score);
}
</script>
<br>
<div class="offset-0.5">
  <button type=button class="btn btn-outline-dark" onclick="window.location='../story/Christmas-story.html';">上一頁 Back</button>
  <button type=button class="btn btn-outline-dark" onclick="window.location='../game/Christmas-game.html';">下一頁 Next</button>
</div>
</body>
</html>
