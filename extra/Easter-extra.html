        var time = 0;
    var sec=0, clear=0, sec2=0, timerid;
    var sec2 = 0;
    var timerid;

    function start(){
        if (!timerid){ // 檢查計時器是否已經啟動
            sec2 = 0;
            var ref = document.getElementById('time_EasterExtra');
            timerid = window.setInterval(() => {
                sec2++;
                ref.innerHTML = sec2;
                localStorage.setItem('time_EasterExtra', sec2);
            }, 1000);
        }
    }

    function clearauto(){
        clear=1;
        clearInterval(timerid);
    }
    </script>
