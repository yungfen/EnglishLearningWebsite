<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanksgiving Quiz</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.0/css/bootstrap.min.css">
<style>
  .hidden { display: none; }
</style>
<head>
    <meta charset="utf-8">
    <!--Bootstrap 核心CSS檔案-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <!-- jQuery -->
    <link rel="stylesheet" href="../assets/form.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!--Bootstrap 核心JavaScript檔案-->
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Andika|Noto+Sans+TC">
<style>
  body {
    font-family: 'Andika',serif;
  }
</style>
<script>
var time = 0;
    var sec=0, clear=0, sec2=0, timerid;
    var sec2 = 0;
    var timerid;

    function start(){
        if (!timerid){ // 檢查計時器是否已經啟動
            sec2 = 0;
            var ref = document.getElementById('time_ThanksgivingTest');
            timerid = window.setInterval(() => {
                sec2++;
                ref.innerHTML = sec2;
                localStorage.setItem('time_ThanksgivingTest', sec2);
            }, 1000);
        }
    }

    function clearauto(){
        clear=1;
        clearInterval(timerid);
    }
    
var speechSynthesis = window.speechSynthesis;
var utterance = new window.SpeechSynthesisUtterance();
function speak1(event) {
      event.preventDefault();
    	speechSynthesis.cancel();

    	utterance.lang = "en-US";// u.lang = 'zh-TW';
		  utterance.rate = "1";

		  utterance.text = "mashed potatoes";
		  speechSynthesis.speak(utterance);

    }
function speak2(event) {
      event.preventDefault();
    	speechSynthesis.cancel();

    	utterance.lang = "en-US";// u.lang = 'zh-TW';
		  utterance.rate = "1";

		  utterance.text = "thankful";
		  speechSynthesis.speak(utterance);

    }
</script>
</head>
<body onload="start();">
<div class="container mt-5">
  <h2 class="mb-4">Thanksgiving Quiz</h2>
  <span id="time_ThanksgivingTest"></span>秒
  <form id="quizForm">
    <!-- Multiple Choice Questions -->
    <div class="form-group">
      <p>1. What do people do on  Thanksgiving?</p>
      <div class="form-check" multiple>
        <input class="form-check-input" type="checkbox" name="question1" id="q1a" value="0">
        <label class="form-check-label" for="q1a">They paint eggs. </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="question1" id="q1b" value="0">
        <label class="form-check-label" for="q1b">They dress up.</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="question1" id="q1c" value="0">
        <label class="form-check-label" for="q1c">They do trick-or-treating. </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="question1" id="q1d" value="1">
        <label class="form-check-label" for="q1d">They prepare thanksgiving dinner. </label>
      </div>
    </div>
    <h2>Listen and Choose</h2>
    2. <button class="btn"  onclick="speak1(event);" id='b1' style="font-size:12px;"><img src="../images/speaker.png" width="50" height="50"></button>
    <radio>
      <input class="form-check-input" type="radio" name="question2" id="q2a" value="1">
      <label class="form-check-label" for="q2a"><img src="../images/pumpkin.png" width="100" height="100"></label>
      <input class="form-check-input" type="radio" name="question2" id="q2b" value="0">
      <label class="form-check-label" for="q2b"><img src="../images/mashedPotatoes.png" width="100" height="100"></label>
      <input class="form-check-input" type="radio" name="question2" id="q2c" value="0">
      <label class="form-check-label" for="q2c"><img src="../images/thanksgiving.png" width="100" height="100"></label>
    </radio>
    <p></p>
    <h2>Listen and Write</h2>
    3.    
    <div class="form-group">
      <button class="btn"  onclick="speak2(event);" id='b1' style="font-size:12px;"><img src="../images/speaker.png" width="50" height="50"></button>
      <input type="text" class="form-control" id="question3"> 
    </div>
    <p></p>
    <h2>Write the English of pictures</h2>
    <!-- Fill in the Blanks -->
    <div class="form-group">
        4. <img src="../images/thanksgiving.png" width="150" height="125"> 寫英文
      <input type="text" class="form-control" id="question4">
    </div>

    <!-- Vocabulary Question -->
    <div class="form-group">
      5. <img src="../images/pumpkinPie.png" width="150" height="125"> 寫英文
      <input type="text" class="form-control" id="question5">
    </div>

    <div class="form-group">
        6. <img src="../images/turkey.png" width="150" height="125"> 寫英文
        <input type="text" class="form-control" id="question6">
      </div>
<br>
    <button type="button" class="btn btn-primary" onclick="calculateScore();">Submit</button>
  </form>

  <div class="mt-4 hidden" id="result">
    <h3>Your Score: <span id="score"></span>/6</h3>
  </div>
</div>

<!-- Bootstrap and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function calculateScore() {
  var score = 0;

  var q1Answer = $('input[name="question1"]:checked').val();
  score += parseInt(q1Answer, 1);

  var q2Answer = $('input[name="question2"]:checked').val();
  score += parseInt(q2Answer, 1);

  var answers3 = $('#question3').val().toLowerCase();
  if(answers3=== 'thankful') score++;

  var answers4 = $('#question4').val().toLowerCase();
  if(answers5=== 'thanksgiving dinner') score++;

  var q5Answer = $('#question5').val().toLowerCase();
  if(q5Answer === 'pumpkin pie') score++;

  var q6Answer = $('#question6').val().toLowerCase();
  if(q6Answer === 'turkey') score++;


  // Display score
  $('#score').text(score);
  $('#result').removeClass('hidden');
    localStorage.setItem('score_ThanksgivingTest', score);
}
</script>
<p></p>
<button type=button class="btn btn-outline-dark" onclick="window.location='../game/Thanksgiving-game.html';">上一頁 Back</button>
<button type=button class="btn btn-outline-dark" onclick="window.location='../extra/Thanksgiving-extra.html';">下一頁 Next</button>

</body>
</html>
