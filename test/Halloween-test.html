<script>

  function start(){
      if (!timerid){ // 檢查計時器是否已經啟動
          sec2 = 0;
          var ref = document.getElementById('time_HalloweenTest');
          timerid = window.setInterval(() => {
              sec2++;
              ref.innerHTML = sec2;
              localStorage.setItem('time_HalloweenTest', sec2);
          }, 1000);
      }
  }

  function clearauto(){
      clear=1;
      clearInterval(timerid);
  }

var speechSynthesis = window.speechSynthesis;
var utterance = new window.SpeechSynthesisUtterance();
function speak1(event) {
      event.preventDefault();

    	utterance.lang = "en-US";// u.lang = 'zh-TW';
		  utterance.rate = "1";

		  utterance.text = "vampire";
		  speechSynthesis.speak(utterance);

<script>
function calculateScore() {
  var score = 0;
  // Multiple Choice
  var q1Answer = $('input[name="question1"]:checked').val();
  score += parseInt(q1Answer, 10);
  //var q2Answer = $('input[name="question2"]:checked').val();
  //score += parseInt(q2Answer, 10);
  // Fill in the Blanks
  var answers3 = $('#question3').val().toLowerCase();
  if(answers3 === 'pumpkin') score++;

  // Vocabulary Question
  var q4Answer = $('#question4').val().toLowerCase();
  if(q4Answer === 'ghost') score++;

  var q5Answer = $('#question5').val().toLowerCase();
  if(q5Answer === 'trick-or-treat') score++;
  // Display score
  $('#score').text(score);
  $('#result').removeClass('hidden');
  localStorage.setItem('score_HalloweenTest', score);
}
